[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0.dev0"
description = "Evidence-driven investigation of GitHub issues against pinned repository snapshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1.1,<2"]

[project.scripts]
repopilot = "repopilot.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
